name: Setup Bun
description: Install Bun and configure the package manager

inputs:
  bun-version:
    description: 'Bun version to install'
    default: '1.3.14'

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
