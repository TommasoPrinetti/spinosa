name: Release

on:
  push:
    tags: ['v*']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          for f in workspace-template/.bin/spinosa install.sh; do bash -n "$f"; done
      - name: Manifest integrity
        run: |
          test -f workspace-template/.spinosa/workspace-files.tsv
          test -f workspace-template/.bin/spinosa
      - name: Validate version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(jq -r '.version' package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: TypeScript typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run tests
        run: bun test test/spinosa
        working-directory: packages/tui

  package:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "value=${VERSION}" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi
      - name: Prepare release assets
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          DIST="dist/v${VERSION}"
          mkdir -p "$DIST"
          cp install.sh "${DIST}/install.sh"
          sed -i 's/^PINNED_VERSION=".*"/PINNED_VERSION="'"${VERSION}"'"/' "${DIST}/install.sh"
          sed -i 's/^PINNED_TAG=".*"/PINNED_TAG="v'"${VERSION}"'"/' "${DIST}/install.sh"
          sha256sum "${DIST}/install.sh" | awk '{print $1"  "$2}' > "${DIST}/checksums.txt"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spinosa-${{ steps.version.outputs.value }}
          path: |
            dist/v${{ steps.version.outputs.value }}/install.sh
            dist/v${{ steps.version.outputs.value }}/checksums.txt

  publish-github:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: spinosa-${{ needs.package.outputs.version }}
          path: dist/v${{ needs.package.outputs.version }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          PRERELEASE="${{ needs.package.outputs.prerelease }}"
          DIST="dist/v${VERSION}"

          RELEASE_ARGS=(
            --target "${GITHUB_REF_NAME}"
            --title "Spinosa v${VERSION}"
            --generate-notes
          )
          [[ "$PRERELEASE" == "true" ]] && RELEASE_ARGS+=(--prerelease)

          gh release create "v${VERSION}" \
            "${RELEASE_ARGS[@]}" \
            "${DIST}/install.sh" \
            "${DIST}/checksums.txt"

      - name: Sync rolling channel tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          PRERELEASE="${{ needs.package.outputs.prerelease }}"
          DIST="dist/v${VERSION}"

          if [[ "$PRERELEASE" == "true" ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi

          # Prepare channel installer with the asset name expected by upgrade resolution.
          CHANNEL_DIST="${DIST}/${CHANNEL}"
          mkdir -p "$CHANNEL_DIST"
          cp "${DIST}/install.sh" "${CHANNEL_DIST}/install.sh"
          sed -i 's/^PINNED_TAG=".*"/PINNED_TAG="'"${CHANNEL}"'"/' "${CHANNEL_DIST}/install.sh"

          # Create channel checksums
          CHANNEL_CHECKSUMS="${CHANNEL_DIST}/checksums.txt"
          sha256sum "${CHANNEL_DIST}/install.sh" | awk '{print $1"  "$2}' > "$CHANNEL_CHECKSUMS"

          # Sync rolling release
          git tag -f "$CHANNEL" "$GITHUB_SHA"
          git push origin "refs/tags/${CHANNEL}:refs/tags/${CHANNEL}" --force

          if gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release upload "$CHANNEL" \
              "${CHANNEL_DIST}/install.sh" \
              "$CHANNEL_CHECKSUMS" --clobber
            [[ "$PRERELEASE" == "true" ]] && PRERELEASE_FLAG="--prerelease" || PRERELEASE_FLAG=""
            gh release edit "$CHANNEL" \
              --title "Spinosa v${VERSION} (${CHANNEL})" \
              --notes "Rolling ${CHANNEL} channel — points to v${VERSION}" \
              $PRERELEASE_FLAG
          else
            gh release create "$CHANNEL" \
              --target "$GITHUB_SHA" \
              --title "Spinosa v${VERSION} (${CHANNEL})" \
              --notes "Rolling ${CHANNEL} channel — points to v${VERSION}" \
              $([[ "$PRERELEASE" == "true" ]] && echo "--prerelease" || true) \
              "${CHANNEL_DIST}/install.sh" \
              "$CHANNEL_CHECKSUMS"
          fi
