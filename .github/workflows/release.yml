name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(jq -r '.version' package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Determine channel
        id: channel
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if echo "$VERSION" | grep -q '-'; then
            echo "name=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "name=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          VERSION="${{ steps.channel.outputs.version }}"
          mkdir -p "dist/v${VERSION}"

          # Tag-specific installer
          cp install.sh "dist/v${VERSION}/install.sh"
          sed -i 's/^PINNED_VERSION=".*"/PINNED_VERSION="'"${VERSION}"'"/' "dist/v${VERSION}/install.sh"
          sed -i 's/^PINNED_TAG=".*"/PINNED_TAG="v'"${VERSION}"'"/' "dist/v${VERSION}/install.sh"
          sha256sum "dist/v${VERSION}/install.sh" | awk '{print $1"  "$2}' > "dist/v${VERSION}/checksums.txt"

          # Channel-specific installer (PINNED_TAG = channel name for upgrade resolution)
          CHANNEL="${{ steps.channel.outputs.name }}"
          mkdir -p "dist/${CHANNEL}"
          cp install.sh "dist/${CHANNEL}/install.sh"
          sed -i 's/^PINNED_VERSION=".*"/PINNED_VERSION="'"${VERSION}"'"/' "dist/${CHANNEL}/install.sh"
          sed -i 's/^PINNED_TAG=".*"/PINNED_TAG="'"${CHANNEL}"'"/' "dist/${CHANNEL}/install.sh"
          sha256sum "dist/${CHANNEL}/install.sh" | awk '{print $1"  "$2}' > "dist/${CHANNEL}/checksums.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.channel.outputs.version }}"
          DIST="dist/v${VERSION}"

          RELEASE_ARGS=(
            --target "${GITHUB_REF_NAME}"
            --title "Spinosa v${VERSION}"
            --generate-notes
          )
          [[ "${{ steps.channel.outputs.prerelease }}" == "true" ]] && RELEASE_ARGS+=(--prerelease)

          gh release create "v${VERSION}" \
            "${RELEASE_ARGS[@]}" \
            "${DIST}/install.sh" \
            "${DIST}/checksums.txt"

      - name: Sync rolling channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL="${{ steps.channel.outputs.name }}"
          VERSION="${{ steps.channel.outputs.version }}"
          DIST="dist/${CHANNEL}"

          git tag -f "$CHANNEL" "$GITHUB_SHA"
          git push origin "refs/tags/${CHANNEL}:refs/tags/${CHANNEL}" --force

          if gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release upload "$CHANNEL" \
              "${DIST}/install.sh" \
              "${DIST}/checksums.txt" --clobber
            gh release edit "$CHANNEL" \
              --title "Spinosa v${VERSION} (${CHANNEL})" \
              --notes "Rolling ${CHANNEL} channel — points to v${VERSION}" \
              $([[ "${{ steps.channel.outputs.prerelease }}" == "true" ]] && echo "--prerelease" || true)
          else
            gh release create "$CHANNEL" \
              --target "$GITHUB_SHA" \
              --title "Spinosa v${VERSION} (${CHANNEL})" \
              --notes "Rolling ${CHANNEL} channel — points to v${VERSION}" \
              $([[ "${{ steps.channel.outputs.prerelease }}" == "true" ]] && echo "--prerelease" || true) \
              "${DIST}/install.sh" \
              "${DIST}/checksums.txt"
          fi
