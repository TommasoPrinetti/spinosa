name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          for f in workspace-template/.bin/spinosa install.sh; do bash -n "$f"; done
      - name: Manifest integrity
        run: |
          test -f workspace-template/.spinosa/workspace-files.tsv
          test -f workspace-template/.bin/spinosa

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: TypeScript typecheck
        run: bun run typecheck

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run tests
        run: bun test test/spinosa
        working-directory: packages/tui
