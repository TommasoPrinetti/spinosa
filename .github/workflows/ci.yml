name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n .bin/spinosa
          bash -n .bin/check-doc-contract.sh
          bash -n .bin/check-startup.sh
          bash -n .bin/validate-skills.sh
          bash -n .bin/package-release.sh
          bash -n .bin/publish-release.sh
          bash -n .bin/build-spinosa-vendor.sh
          bash -n install.sh

      - name: Startup contract check
        run: bash .bin/check-startup.sh

      - name: Doc contract check
        run: bash .bin/check-doc-contract.sh

      - name: Skill validation
        run: bash .bin/validate-skills.sh

      - name: Release packaging syntax surface
        run: |
          test -f .spinosa/framework-files.tsv
          test -f RELEASE_GUIDE.md
