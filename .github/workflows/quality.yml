name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - beta

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Core unit tests (upgrade / uninstall / preflight)
        run: >
          bun run --cwd packages/spinosa-core test
          test/uninstall.test.ts
          test/preflight.test.ts
          test/upgrade-errors.test.ts
          test/upgrade-network.test.ts
          test/version.test.ts
          test/channels.test.ts

      - name: Installer bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bun run test:installer
